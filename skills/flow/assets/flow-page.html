<meta charset="utf-8">
<title>Booking sharing flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* A flow, to be read and approved. Overview first, details on demand: the numbers that matter,
   then every moment as one line of steps, then the reasons in words, then what changes on each
   surface with today and tomorrow side by side. Few boxes: rules and space carry the structure,
   so the parts that matter stand out. Colour says who acts; filled means new, outlined changed. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --ink: #171d27; --muted: #5a6575; --line: #dde2ea; --line-strong: #a3adbd;
  --sketch: #f1f3f7; --sketch-line: #a5afbf;
  --accent: #2748c9; --accent-soft: #e6eafb; --on-accent: #ffffff;
  --gap: #b3261e; --gap-soft: #fbe8e6;
  --incon: #8f5500; --incon-soft: #faefd8;
  --unclear: #5f44b3; --unclear-soft: #ebe7fa;
  --ok: #17754a; --ok-soft: #e0f2e8;
  --a1: #2459c2; --a1s: #e4ecfb;
  --a2: #b4490e; --a2s: #fbe9de;
  --a3: #0e7757; --a3s: #ddf2e9;
  --a4: #7740b3; --a4s: #efe7f9;
  --a5: #ad2f6c; --a5s: #fae5ee;
  --a6: #6f6200; --a6s: #f3edcc;
  --on-actor: #ffffff;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --surface: #171d27; --ink: #e6eaf1; --muted: #99a5b6; --line: #2a3442; --line-strong: #5d6c82;
    --sketch: #1c2430; --sketch-line: #5b6a80;
    --accent: #91adff; --accent-soft: #1c2950; --on-accent: #0f131a;
    --gap: #ff8f80; --gap-soft: #3a1c19;
    --incon: #f0b35e; --incon-soft: #382911;
    --unclear: #baa6f6; --unclear-soft: #292244;
    --ok: #63d19a; --ok-soft: #143324;
    --a1: #8db2ff; --a1s: #17274a;
    --a2: #ffa877; --a2s: #3a2213;
    --a3: #5fd2a9; --a3s: #11312a;
    --a4: #c5a3f6; --a4s: #2b2046;
    --a5: #f598c0; --a5s: #3c1b2c;
    --a6: #d9c463; --a6s: #302c0f;
    --on-actor: #0f131a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171d27; --ink: #e6eaf1; --muted: #99a5b6; --line: #2a3442; --line-strong: #5d6c82;
  --sketch: #1c2430; --sketch-line: #5b6a80;
  --accent: #91adff; --accent-soft: #1c2950; --on-accent: #0f131a;
  --gap: #ff8f80; --gap-soft: #3a1c19;
  --incon: #f0b35e; --incon-soft: #382911;
  --unclear: #baa6f6; --unclear-soft: #292244;
  --ok: #63d19a; --ok-soft: #143324;
  --a1: #8db2ff; --a1s: #17274a;
  --a2: #ffa877; --a2s: #3a2213;
  --a3: #5fd2a9; --a3s: #11312a;
  --a4: #c5a3f6; --a4s: #2b2046;
  --a5: #f598c0; --a5s: #3c1b2c;
  --a6: #d9c463; --a6s: #302c0f;
  --on-actor: #0f131a;
  color-scheme: dark;
}
.act-1 { --c: var(--a1); --cs: var(--a1s); } .act-2 { --c: var(--a2); --cs: var(--a2s); }
.act-3 { --c: var(--a3); --cs: var(--a3s); } .act-4 { --c: var(--a4); --cs: var(--a4s); }
.act-5 { --c: var(--a5); --cs: var(--a5s); } .act-6 { --c: var(--a6); --cs: var(--a6s); }

body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, ul, ol, fieldset, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* the page: a reading column, and on wide screens a rail that says where you are */
.page { max-width: 1240px; margin: 0 auto; }
.rail { display: none; }
@media (min-width: 1180px) {
  .page { display: grid; grid-template-columns: 188px minmax(0, 1fr); column-gap: 36px; padding-left: 24px; }
  .rail { display: block; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; padding: 44px 0; }
}
.rail ol { display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.rail a {
  display: flex; justify-content: space-between; gap: 8px; margin-left: -1px; padding: 6px 12px;
  border-left: 2px solid transparent; font-size: 13.5px; line-height: 1.3; color: var(--muted); text-decoration: none;
}
.rail a:hover { color: var(--ink); }
.rail a.here { color: var(--ink); font-weight: 500; border-left-color: var(--accent); }
.rail .n { font: 500 11.5px var(--mono); }
.sheet {
  max-width: 1000px; padding-block: 36px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 52px;
}
.sheet > * { min-width: 0; }
.broken { padding: 24px 16px; font-family: var(--mono); color: var(--gap); }

/* small shared parts */
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chip {
  display: inline-block; font: 500 12px var(--font); line-height: 1.7; padding: 0 9px; border-radius: 999px;
  white-space: nowrap; background: var(--line); color: var(--muted);
}
.chip.gap, .num.gap, .pin.gap { background: var(--gap-soft); color: var(--gap); }
.chip.inconsistency, .num.inconsistency, .pin.inconsistency { background: var(--incon-soft); color: var(--incon); }
.chip.unclear, .num.unclear, .pin.unclear { background: var(--unclear-soft); color: var(--unclear); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.num, .pin {
  display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
  font: 500 12px var(--mono); font-variant-numeric: tabular-nums; text-decoration: none;
  background: var(--line); color: var(--muted);
}
.av {
  flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); color: var(--on-actor); font: 600 11px var(--mono);
}
.tag {
  flex: none; font: 500 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; line-height: 1.65;
  padding: 0 7px; border-radius: 999px; white-space: nowrap;
}
.tag.new { background: var(--c); color: var(--on-actor); }
.tag.changed { box-shadow: inset 0 0 0 1px var(--c); color: var(--c); }
.tag.same { box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.scroll { overflow-x: auto; }

/* header */
.top { display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: clamp(28px, 4.4vw, 42px); line-height: 1.08; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
.value { font-size: 18.5px; line-height: 1.45; max-width: 62ch; text-wrap: pretty; }
.glance {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 1px; max-width: 820px; margin-top: 6px;
  background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.glance > * { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px 13px; background: var(--surface); color: var(--ink); text-decoration: none; }
.glance strong { font-size: 28px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.glance span { font-size: 13px; line-height: 1.3; color: var(--muted); }
.glance a:hover { background: var(--accent-soft); }
.glance .hot strong { color: var(--accent); }
.glance .warn strong { color: var(--gap); }
.cast { display: flex; flex-wrap: wrap; gap: 10px 24px; }
.cast li { max-width: 300px; font-size: 13.5px; line-height: 1.35; }
/* a person in the cast is a switch: it lights up their steps and dims the rest */
.cast button {
  display: flex; align-items: flex-start; gap: 9px; margin: -5px -9px; padding: 5px 9px; border: 1px solid transparent; border-radius: 9px;
  font: inherit; text-align: left; color: inherit; background: none; cursor: pointer;
}
.cast button:hover { background: var(--cs); }
.cast button[aria-pressed="true"] { background: var(--cs); border-color: var(--c); }
.cast-hint { font-size: 12.5px; color: var(--muted); }
[data-focus] .pill, [data-focus] .change { opacity: .28; transition: opacity .15s; }
[data-focus="act-1"] .act-1, [data-focus="act-2"] .act-2, [data-focus="act-3"] .act-3,
[data-focus="act-4"] .act-4, [data-focus="act-5"] .act-5, [data-focus="act-6"] .act-6 { opacity: 1; }
.cast strong { display: block; font-weight: 600; }
.cast .who { color: var(--muted); }

section, figure { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 20px; }
h2 { font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
h3 { font-size: 17px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.lead { color: var(--muted); max-width: 72ch; }
figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend { --c: var(--muted); display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }

/* the whole flow in words: one column, set for reading */
.words { display: flex; flex-direction: column; gap: 20px; max-width: 68ch; }
.words h3 { font-size: 16px; margin-bottom: 3px; }
.words p { font-size: 16px; line-height: 1.65; text-wrap: pretty; }

/* the moments: each one a line of steps, in the order things happen */
.journeys { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.journey {
  display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 8px 28px; align-items: start;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.j-head { display: flex; gap: 10px; align-items: baseline; }
.j-n { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.j-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
.j-when { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 0; }
.link { display: inline-flex; align-items: center; max-width: 100%; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 3px 11px 3px 3px; border-radius: 999px;
  font-size: 13.5px; line-height: 1.3; color: var(--ink); text-decoration: none;
  background: var(--cs); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
}
.pill.changed { background: var(--surface); border-color: var(--c); }
.pill.same { background: transparent; border-color: var(--line-strong); color: var(--muted); }
a.pill:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.pill .av { width: 20px; height: 20px; font-size: 10px; }
.to { width: 26px; height: 10px; flex: none; margin: 0 3px; fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.to.handoff { stroke: var(--ink); stroke-width: 2; }
.legend .pill { padding: 1px 9px; font-size: 12px; }

/* the life of the main object */
.wires { position: absolute; left: 0; top: 0; pointer-events: none; }
.wire { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.head { fill: var(--line-strong); }
.states {
  position: relative; display: flex; gap: 44px; min-width: min-content;
  padding: var(--arc-a, 16px) 20px var(--arc-b, 16px);
}
.state {
  position: relative; z-index: 1; flex: 1 1 0; min-width: 124px; max-width: 230px;
  display: flex; flex-direction: column; gap: 3px; padding: 9px 12px 10px;
  background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 10px;
}
.state strong { font-size: 14px; font-weight: 600; line-height: 1.25; }
.state span { font-size: 12.5px; line-height: 1.35; color: var(--muted); }

/* what changes, surface by surface: today and tomorrow side by side */
.changes { gap: 36px; }
.group { display: flex; flex-direction: column; }
.group-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.group-head h3 { font: 600 12.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.group-head .n { font: 500 12px var(--mono); color: var(--muted); }
.change {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px 36px; align-items: start;
  padding: 20px 0 22px; border-bottom: 1px solid var(--line); scroll-margin-top: 20px;
}
.change:target { box-shadow: -14px 0 0 -11px var(--c); }
@media (min-width: 900px) { .change.wide { grid-template-columns: minmax(0, 1fr) minmax(0, 330px); } }
.c-text { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-width: 70ch; }
.c-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.c-head h4 { font-size: 17px; line-height: 1.3; font-weight: 600; text-wrap: balance; }
.c-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--muted); }
.c-meta .step-id { font: 500 12px var(--mono); color: var(--c); }
.what { font-size: 15px; line-height: 1.5; }
.delta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.delta > div { padding: 10px 13px 11px; border-radius: 8px; font-size: 14.5px; line-height: 1.45; }
.delta b { display: block; margin-bottom: 3px; font: 500 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; }
.delta .was { background: var(--sketch); color: var(--muted); }
.delta .now { background: var(--cs); box-shadow: inset 3px 0 0 var(--c); }
.delta .now b { color: var(--c); }
.branches { display: flex; flex-direction: column; gap: 7px; }
.branches li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 13.5px; line-height: 1.45; }
.branches strong { font-weight: 600; }
.exit { color: var(--muted); }
.pins { display: flex; flex-wrap: wrap; gap: 6px; }

/* the sketch of a screen: a small window, deliberately rough */
.sketch { border: 1px solid var(--sketch-line); border-radius: 6px; background: var(--sketch); overflow: hidden; font-size: 12.5px; line-height: 1.4; }
.sk-bar { display: flex; align-items: center; gap: 8px; padding: 6px 9px; font-weight: 600; background: var(--surface); border-bottom: 1px solid var(--sketch-line); }
.sk-bar::before {
  content: ""; flex: none; width: 26px; height: 6px;
  background: radial-gradient(circle at 3px 3px, var(--sketch-line) 2.6px, transparent 3px) 0 0 / 10px 6px repeat-x;
}
.sk-body { display: flex; flex-direction: column; gap: 7px; padding: 9px; }
.sk-head { font-weight: 600; }
.sk-field { display: flex; flex-direction: column; gap: 2px; }
.sk-label { font-size: 11px; color: var(--muted); }
.sk-input, .sk-list, .sk-btn { background: var(--surface); border: 1px solid var(--sketch-line); border-radius: 3px; }
.sk-input { padding: 4px 6px; min-height: 26px; }
.sk-list li { padding: 4px 6px; border-bottom: 1px solid var(--sketch-line); }
.sk-list li:last-child { border-bottom: 0; }
.sk-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
.sk-btn { padding: 3px 10px; }
.sk-btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.sk-note { background: var(--surface); border-left: 3px solid var(--sketch-line); padding: 5px 8px; border-radius: 2px; }
.sk-box {
  min-height: 46px; display: grid; place-items: center; text-align: center; padding: 6px; color: var(--muted);
  border: 1px solid var(--sketch-line); border-radius: 3px;
  background: repeating-linear-gradient(135deg, transparent 0 7px, var(--line) 7px 8px);
}

/* what is still open */
.points { display: flex; flex-direction: column; gap: 14px; max-width: 880px; }
.point { padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px; }
.point-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.why { max-width: 72ch; }
.options { display: flex; flex-direction: column; gap: 6px; }
.option { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.option input { margin: 4px 0 0; accent-color: var(--accent); }
.option-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cost, .rec { font-size: 13.5px; color: var(--muted); }
.cost-label { font-weight: 500; }
.note, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
.answers { display: flex; flex-direction: column; gap: 12px; max-width: 880px; }
textarea { font-family: var(--mono); font-size: 13px; min-height: 96px; resize: vertical; }
button { align-self: flex-start; font: 500 14px var(--font); color: var(--on-accent); background: var(--accent); border: 0; border-radius: 6px; padding: 9px 16px; cursor: pointer; }

/* the choices, and the folded parts */
.groups { display: flex; flex-direction: column; gap: 10px; }
details.panel { padding: 0 16px; }
summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 13px 0; cursor: pointer; font-size: 16px; font-weight: 600; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary::before { transform: rotate(45deg); }
details > .lead { margin-bottom: 12px; }
.decisions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); column-gap: 32px; padding-bottom: 6px; }
.decisions li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.decisions .n { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.decisions .q { display: block; font-size: 13px; color: var(--muted); }
.decisions .a { display: block; font-size: 14.5px; font-weight: 500; }
.decisions li { scroll-margin-top: 20px; }
.decisions li:target { background: var(--accent-soft); box-shadow: -8px 0 0 var(--accent-soft), 8px 0 0 var(--accent-soft); }
.decisions .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.in-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--muted); }
.in-steps a, .in-steps span.id { font: 500 12px var(--mono); text-decoration: none; }
/* my choices: the user says fine or change it, right where they read them */
.verdict { display: flex; flex-wrap: wrap; gap: 6px; }
.v {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px 2px 8px; border: 1px solid var(--line); border-radius: 999px;
  font-size: 13px; color: var(--muted); cursor: pointer;
}
.v input { margin: 0; }
.v.ok input { accent-color: var(--ok); }
.v.no input { accent-color: var(--gap); }
.v.ok:has(input:checked) { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.v.no:has(input:checked) { border-color: var(--gap); background: var(--gap-soft); color: var(--gap); }
.decisions .note { display: none; }
.decisions li:has(.no input:checked) .note, .decisions .note.filled { display: block; }
.decisions li:has(.no input:checked) { border-top-color: var(--gap); }
.c-choices { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: var(--muted); }
.pin.me { background: var(--accent-soft); color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 14px; margin-bottom: 12px; }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 14px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.src { font: 400 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
td.ans { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.plain { display: flex; flex-direction: column; gap: 6px; max-width: 78ch; }
.plain li { padding-left: 18px; position: relative; }

<!--
  HOW TO FILL THIS PAGE
  Replace the <title> above and the whole JSON below. Nothing else changes: the page draws the
  diagrams itself from this data, and picks its parts from it too. Each path is one line of steps
  under "The flow". Each step that changes gets a row under "What changes", grouped by surface, with
  "today" and "what" side by side. The life of the object is drawn only when it is not a straight
  line. Keep it valid JSON, and never write "</script" inside it.

  title       the flow's name, same as the <title>
  status      where the work stands, for example "Draft 2 · 13 Nov 2026"
  value       what the feature is for, in one sentence
  summary[]   the whole flow explained in words, reasons included: five to nine parts, each
              { "title": a few words, "text": two to four sentences }. One part for the idea, one
              for each main moment or area the flow touches, one for how it ends, one for what
              does not change. Each text says what was decided, why (what goes wrong today, or
              what it protects), and what follows from it, the smaller things you decided
              yourself included. 300 to 600 words in all. Somebody who reads only this knows
              how the flow works and why. Plain words: no step ids, no code names.
  labels      the page's fixed words: translate every one into the user's language
  actors[]    name (two or three words), who (one line), steps[]
    step      id: one letter per actor and a number (A1, A2 ... B1 ...); the letter is the actor's badge,
              title (a few words, starting with what the actor does),
              where: the surface, then " · ", then the screen ("Backoffice · Users", "Email").
                The part before the first " · " groups the cards, so name each surface the same
                way every time,
              change: "new" | "changed" | "same" compared with today,
              screen: the sketch, only for a screen that is new or changes. A list of blocks:
                { "t": "bar",     "text": "..." }                  the screen's title bar (put it first)
                { "t": "text",    "text": "..." }                  a line of text
                { "t": "field",   "label": "...", "value": "..." } an input
                { "t": "list",    "items": ["..."] }               rows
                { "t": "buttons", "items": ["Cancel", "*Save"] }   a leading * marks the main one
                { "t": "note",    "text": "..." }                  a message from the system
                { "t": "box",     "text": "..." }                  a placeholder (image, chart, preview)
              what: one sentence on what the person sees and does,
              today: what happens here today (only when change is "changed"); the page sets it
                beside "what", so write the two as a before and an after of the same thing,
              branches[]: kind (one or two words in the user's language: empty, error, not allowed,
                          waiting ...), when, sees, exit (the way out),
              A step that is "same", with no screen, no branches and no points, gets no card: it
              shows only in its moments, as the context of what changes,
              points: numbers of the open points that bite on this step
  paths[]     the flow in the order things happen. One path per moment: setting it up, the everyday
              use, each other way in, each way it ends. A path is one story told start to end.
              title: the moment, with its subject ("Sam shares a booking"),
              when: optional, one short line on what starts it,
              steps: the step ids in order, across actors: ["A1", "A2", "B1"].
              A path never forks: two alternatives are two paths, and they may share steps.
              Two paths differ in their steps: another outcome at the same steps (confirmed or
              declined) is a branch of the step, not another path. A path that starts like an
              earlier one begins at the last step they share, not from the top again.
              Every step is in at least one path. Order them as a story: setting up, the everyday use,
              the rarer ways in, then how it ends. Do not split a moment to make paths short, nor
              join two: each path is one line on the page, as long as the moment is.
  states      optional: the life of the main object, when it has more than two states. Drawn only
              when some edge skips ahead or goes back.
              title, nodes[] in the order of a normal life: id, label, how (how it gets there),
              edges: [from, to] pairs
  decisions[] every choice that made this flow: n, q (the question, short), a (the choice),
              by: "you" (the user answered) | "me" (you chose, they can object) | "before" (already decided),
              steps: the ids of the steps where the choice shows, so each step lists its choices
                and each choice links to its steps; leave it out for a choice about the whole flow.
              The user marks each "me" choice fine or change it on the page, and pastes the result.
  points[]    only what is still open: n, kind: "gap" | "inconsistency" | "unclear", title,
              where, why (what happens to the person), options[]: key, text, cost,
              recommended (an option key), because
  coverage[]  every case the system knows: case, source (path:line),
              status: "covered" | "unsupported" | "open",
              ref: the step id, or what the person sees instead, or "point N"
  out[]       what is out of this flow, on purpose
-->

<script>
(function () {
  var root = document.getElementById('flow');
  var d;
  try {
    d = JSON.parse(document.getElementById('flow-data').textContent);
  } catch (e) {
    root.className = 'broken';
    root.textContent = 'flow-data is not valid JSON: ' + e.message;
    return;
  }

  var L = d.labels || {};
  var kinds = L.kinds || {};
  var who = L.by || {};
  var actors = d.actors || [];
  var decisions = d.decisions || [];
  var points = d.points || [];
  var coverage = d.coverage || [];
  var kindOf = {};
  points.forEach(function (p) { kindOf[p.n] = p.kind; });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function list(cls, items) {
    var ul = el('ul', cls);
    items.forEach(function (i) { add(ul, el('li', null, i)); });
    return ul;
  }
  function count(label, n, cls) { return el('span', 'chip ' + (cls || ''), label + ' ' + n); }
  function section(title) { return add(el('section'), el('h2', null, title)); }

  /* ---------- who and in what order ---------- */
  var stepOf = {};
  actors.forEach(function (a, i) {
    var first = (a.steps || [])[0];
    a.cls = 'act-' + (i % 6 + 1);
    a.badge = ((first && /^[^\d\s]+/.exec(first.id)) || [String(a.name || '?').charAt(0)])[0].slice(0, 2).toUpperCase();
    (a.steps || []).forEach(function (s) { s.actor = a; stepOf[s.id] = s; });
  });
  function av(a) { var n = el('span', 'av', a.badge); n.setAttribute('aria-hidden', 'true'); return n; }

  var paths = [], inPath = {};
  (d.paths || []).forEach(function (p) {
    var steps = (p.steps || []).map(function (id) { return stepOf[id]; }).filter(Boolean);
    steps.forEach(function (s) { inPath[s.id] = true; });
    if (steps.length) paths.push({ title: p.title, when: p.when, steps: steps });
  });
  // a step no path names still gets listed: one path per actor with what is left
  actors.forEach(function (a) {
    var rest = (a.steps || []).filter(function (s) { return !inPath[s.id]; });
    if (rest.length) paths.push({ title: a.name, steps: rest });
  });
  // a step gets a row under "what changes" when it changes something, or when something can go differently there
  function carded(s) {
    return (s.change || 'same') !== 'same' || (s.branches || []).length || (s.points || []).length || (s.screen || []).length;
  }
  function stepLink(s, cls, text) {
    var a = el(carded(s) ? 'a' : 'span', cls, text);
    if (carded(s)) a.href = '#s-' + s.id;
    return a;
  }

  /* ---------- drawing over laid-out boxes ----------
     The boxes are ordinary HTML, so text wraps and nothing is ever cut. The lines are an SVG laid
     over them, drawn from where the browser put each box and drawn again when the size changes. */
  var NS = 'http://www.w3.org/2000/svg';
  var drawn = 0;
  function sv(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function overlay(host, paint) {
    var svg = sv('svg', { 'class': 'wires', 'aria-hidden': 'true' });
    var id = 'head-' + (++drawn), frame;
    add(host, svg);
    function redraw() {
      var base = host.getBoundingClientRect(), W = host.offsetWidth, H = host.offsetHeight;
      while (svg.lastChild) svg.removeChild(svg.lastChild);
      svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      var defs = svg.appendChild(sv('defs', {}));
      ['', ' handoff'].forEach(function (kind, i) {
        var m = sv('marker', { id: id + i, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, markerUnits: 'userSpaceOnUse', orient: 'auto' });
        m.appendChild(sv('path', { d: 'M0 .5L10 5L0 9.5z', 'class': 'head' + kind }));
        defs.appendChild(m);
      });
      paint({
        W: W, H: H,
        box: function (n) {
          var r = n.getBoundingClientRect();
          return { l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top,
            cx: (r.left + r.right) / 2 - base.left, cy: (r.top + r.bottom) / 2 - base.top };
        },
        wire: function (path, handoff) {
          svg.appendChild(sv('path', { d: path, 'class': 'wire' + (handoff ? ' handoff' : ''), 'marker-end': 'url(#' + id + (handoff ? 1 : 0) + ')' }));
        },
        line: function (x1, y1, x2, y2, cls) { svg.appendChild(sv('line', { x1: x1, y1: y1, x2: x2, y2: y2, 'class': cls })); }
      });
    }
    function later() { cancelAnimationFrame(frame); frame = requestAnimationFrame(redraw); }
    if (window.ResizeObserver) new ResizeObserver(later).observe(host); else window.addEventListener('resize', later);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    later();
  }
  /* ---------- the life of the main object: states on a line, the long jumps as arcs ---------- */
  function lifeFigure(st) {
    var box = el('div', 'states'), at = {}, there = {};
    var cells = (st.nodes || []).map(function (n, i) {
      at[n.id] = i;
      var c = add(el('div', 'state'), el('strong', null, n.label), n.how ? el('span', null, n.how) : null);
      add(box, c);
      return c;
    });
    var edges = (st.edges || []).map(function (e) { return { a: at[e[0]], b: at[e[1]] }; })
      .filter(function (e) { return e.a != null && e.b != null && e.a !== e.b; });
    var ahead = 0, back = 0;
    edges.forEach(function (e) {
      there[e.a + '>' + e.b] = true;
      if (e.b - e.a > 1) ahead = Math.max(ahead, e.b - e.a);
      if (e.a - e.b > 1) back = Math.max(back, e.a - e.b);
    });
    function bow(span) { return 26 + 20 * (span - 2); }
    function room(span) { return (span ? Math.round(.75 * bow(span)) + 16 : 16) + 'px'; }
    box.style.setProperty('--arc-a', room(ahead));
    box.style.setProperty('--arc-b', room(back));
    overlay(box, function (g) {
      var down = getComputedStyle(box).flexDirection === 'column';
      edges.forEach(function (e) {
        var a = g.box(cells[e.a]), b = g.box(cells[e.b]), span = e.b - e.a, fwd = span > 0;
        var both = there[e.b + '>' + e.a], h = bow(Math.abs(span)), p;
        if (Math.abs(span) === 1) {
          var off = both ? (fwd ? -7 : 7) : 0;
          if (down) p = 'M' + (a.cx + off) + ' ' + (fwd ? a.b : a.t) + 'V' + (fwd ? b.t - 1 : b.b + 1);
          else p = 'M' + (fwd ? a.r : a.l) + ' ' + (a.cy + off) + 'H' + (fwd ? b.l - 1 : b.r + 1);
        } else if (down) {
          var x = fwd ? a.r : a.l, sx = fwd ? 1 : -1, y1 = a.cy + sx * 8, y2 = b.cy - sx * 8;
          p = 'M' + x + ' ' + y1 + 'C' + (x + sx * h) + ' ' + y1 + ' ' + (x + sx * h) + ' ' + y2 + ' ' + (x + sx) + ' ' + y2;
        } else {
          var y = fwd ? a.t : a.b, sy = fwd ? -1 : 1, x1 = a.cx - sy * 12, x2 = b.cx + sy * 12;
          p = 'M' + x1 + ' ' + y + 'C' + x1 + ' ' + (y + sy * h) + ' ' + x2 + ' ' + (y + sy * h) + ' ' + x2 + ' ' + (y + sy);
        }
        g.wire(p, false);
      });
    });
    return add(el('figure', 'life'), add(el('div', 'panel'), add(el('div', 'scroll'), box)));
  }

  /* ---------- the sketch of a screen ---------- */
  function sketch(blocks) {
    var box = el('div', 'sketch'), body = el('div', 'sk-body');
    blocks.forEach(function (b, i) {
      if (b.t === 'bar') add(i ? body : box, el('div', i ? 'sk-head' : 'sk-bar', b.text));
      else if (b.t === 'field') add(body, add(el('div', 'sk-field'), el('span', 'sk-label', b.label), el('span', 'sk-input', b.value || '')));
      else if (b.t === 'list') add(body, list('sk-list', b.items || []));
      else if (b.t === 'buttons') {
        var row = el('div', 'sk-buttons');
        (b.items || []).forEach(function (i) {
          var main = i.charAt(0) === '*';
          add(row, el('span', 'sk-btn' + (main ? ' primary' : ''), main ? i.slice(1) : i));
        });
        add(body, row);
      }
      else if (b.t === 'note') add(body, el('div', 'sk-note', b.text));
      else if (b.t === 'box') add(body, el('div', 'sk-box', b.text));
      else add(body, el('div', 'sk-text', b.text));
    });
    return body.firstChild ? add(box, body) : box;
  }

  /* ---------- the moments: each path as one line of steps ---------- */
  function arrow(handoff, title) {
    var s = sv('svg', { 'class': 'to' + (handoff ? ' handoff' : ''), viewBox: '0 0 26 10', role: 'img', 'aria-label': title });
    s.appendChild(sv('path', { d: 'M1 5H23M19 1.5L24 5L19 8.5' }));
    return s;
  }
  function pill(s) {
    var change = s.change || 'same';
    var p = stepLink(s, 'pill ' + s.actor.cls + ' ' + change);
    p.title = s.actor.name + ' · ' + (L[change] || change);
    return add(p, av(s.actor), el('span', null, s.title));
  }
  function journeys() {
    var ol = el('ol', 'journeys');
    paths.forEach(function (p, pi) {
      var chain = el('div', 'chain');
      p.steps.forEach(function (s, i) {
        // the arrow travels with the step it points to, so a wrapped line never ends on an arrow
        var prev = p.steps[i - 1], hand = prev && prev.actor !== s.actor;
        add(chain, add(el('span', 'link'), prev ? arrow(hand, hand ? (L.handoff || 'passes to someone else') : '→') : null, pill(s)));
      });
      add(ol, add(el('li', 'journey'),
        add(el('div', 'j-head'), el('span', 'j-n', String(pi + 1)),
          add(el('span', 'j-title', p.title), p.when ? el('span', 'j-when', p.when) : null)),
        chain));
    });
    var legend = add(el('span', 'legend'),
      el('span', 'pill new', L['new'] || 'New'), el('span', 'pill changed', L.changed || 'Changed'), el('span', 'pill same', L.same || 'As today'));
    var hand = add(el('span', 'legend'), arrow(true, ''), el('span', null, L.handoff || 'passes to someone else'));
    return add(el('figure'), ol, add(el('figcaption'), legend, hand, L.flowCaption ? el('span', null, L.flowCaption) : null));
  }

  /* ---------- what changes: one row per step, today and tomorrow side by side ---------- */
  function row(s, surface) {
    var change = s.change || 'same';
    var screen = s.screen && s.screen.length ? sketch(s.screen) : null;
    var art = el('article', 'change ' + s.actor.cls + (screen ? ' wide' : ''));
    art.id = 's-' + s.id;
    var place = String(s.where || '').split(' · ').slice(1).join(' · ');
    var text = add(el('div', 'c-text'),
      add(el('div', 'c-head'), el('h4', null, s.title), el('span', 'tag ' + change, L[change] || change)),
      add(el('div', 'c-meta'), av(s.actor), el('span', null, s.actor.name), place ? el('span', null, '· ' + place) : null, el('span', 'step-id', s.id)));
    if (s.today) {
      add(text, add(el('div', 'delta'),
        add(el('div', 'was'), el('b', null, L.today || 'Today'), document.createTextNode(s.today)),
        add(el('div', 'now'), el('b', null, L.now || 'With this flow'), document.createTextNode(s.what || ''))));
    } else if (s.what) add(text, el('p', 'what', s.what));
    if (s.branches && s.branches.length) {
      var ul = el('ul', 'branches');
      s.branches.forEach(function (b) {
        var body = el('span');
        add(body, el('strong', null, b.when), document.createTextNode(': ' + b.sees + (b.exit ? '. ' : '')));
        if (b.exit) add(body, el('span', 'exit', '→ ' + b.exit));
        add(ul, add(el('li'), el('span', 'chip', b.kind), body));
      });
      add(text, ul);
    }
    var here = decisions.filter(function (c) { return (c.steps || []).indexOf(s.id) >= 0; });
    if (here.length) {
      var cc = add(el('div', 'c-choices'), el('span', null, L.choicesHere || 'Choices here'));
      here.forEach(function (c) {
        var a = el('a', 'pin ' + (c.by === 'me' ? 'me' : ''), String(c.n));
        a.href = '#c-' + c.n; a.title = c.q;
        add(cc, a);
      });
      add(text, cc);
    }
    if (s.points && s.points.length) {
      var pins = el('div', 'pins');
      s.points.forEach(function (n) {
        var a = el('a', 'pin ' + (kindOf[n] || ''), String(n));
        a.href = '#p-' + n;
        a.setAttribute('aria-label', (L.points || 'Still open') + ' ' + n);
        add(pins, a);
      });
      add(text, pins);
    }
    return add(art, text, screen);
  }

  // the surface is what "where" says before its first " · ": Backoffice · Users -> Backoffice
  function changesSection() {
    var groups = [], byName = {};
    actors.forEach(function (a) {
      (a.steps || []).filter(carded).forEach(function (s) {
        var name = String(s.where || '').split(' · ')[0].trim() || '—';
        if (!byName[name]) groups.push(byName[name] = { name: name, steps: [] });
        byName[name].steps.push(s);
      });
    });
    if (!groups.length) return null;
    var sec = section(L.changes || 'What changes');
    sec.className = 'changes';
    groups.forEach(function (g) {
      var box = add(el('div', 'group'), add(el('div', 'group-head'), el('h3', null, g.name), el('span', 'n', String(g.steps.length))));
      g.steps.forEach(function (s) { add(box, row(s)); });
      add(sec, box);
    });
    return sec;
  }

  /* ---------- what is still open ---------- */
  var out, toCheck; // the answers textarea, and the number at the top that counts what is left to check
  function picked(name, id) {
    var r = document.querySelector('input[name="' + name + '"]:checked');
    var note = document.getElementById(id).value.trim();
    return { v: r ? r.value : null, note: note };
  }
  function update() {
    if (!out) return;
    var lines = points.map(function (p) {
      var x = picked('p' + p.n, 'p' + p.n + '-note');
      return (L.point || 'Point') + ' ' + p.n + ': ' + (x.v || '?') + (x.note ? ' (' + x.note + ')' : '');
    });
    var left = 0;
    decisions.forEach(function (c) {
      if (c.by !== 'me') return;
      var x = picked('c' + c.n, 'c' + c.n + '-note');
      if (!x.v) left++;
      var word = x.v === 'ok' ? (L.fine || 'fine') : x.v === 'no' ? (L.change || 'change it') : '?';
      lines.push((L.choice || 'Choice') + ' ' + c.n + ': ' + word + (x.note ? ' (' + x.note + ')' : ''));
      document.getElementById('c' + c.n + '-note').classList.toggle('filled', !!x.note);
    });
    if (toCheck) toCheck.textContent = String(left);
    out.value = lines.join('\n');
  }
  function answersBox() {
    out = el('textarea');
    out.id = 'answers'; out.readOnly = true;
    out.setAttribute('aria-label', L.answers || 'Your answers');
    var btn = el('button', null, L.copy || 'Copy answers');
    btn.type = 'button'; btn.id = 'copy-answers';
    btn.addEventListener('click', function () {
      function done() {
        btn.textContent = L.copied || 'Copied';
        setTimeout(function () { btn.textContent = L.copy || 'Copy answers'; }, 1500);
      }
      function select() { out.focus(); out.select(); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).then(done, select);
      else select();
    });
    return add(el('div', 'answers'), el('h3', null, L.answers || 'Your answers'),
      L.answersLead ? el('p', 'lead', L.answersLead) : null, out, btn);
  }
  function verdict(c) {
    var box = el('div', 'verdict');
    box.setAttribute('role', 'radiogroup');
    box.setAttribute('aria-label', c.q);
    [['ok', L.fine || 'fine'], ['no', L.change || 'change it']].forEach(function (o) {
      var r = el('input');
      r.type = 'radio'; r.name = 'c' + c.n; r.value = o[0];
      r.addEventListener('change', update);
      add(box, add(el('label', 'v ' + o[0]), r, document.createTextNode(o[1])));
    });
    var note = el('input', 'note');
    note.type = 'text'; note.id = 'c' + c.n + '-note';
    note.placeholder = L.changeHow || 'What should it be?';
    note.setAttribute('aria-label', (L.note || 'Note') + ' ' + c.n);
    note.addEventListener('input', update);
    return [box, note];
  }

  function point(p) {
    var a = el('article', 'point panel');
    a.id = 'p-' + p.n;
    add(a, add(el('div', 'point-head'), el('span', 'num ' + p.kind, String(p.n)), el('span', 'chip ' + p.kind, kinds[p.kind] || p.kind)));
    add(a, el('h3', null, p.title));
    if (p.where) add(a, el('p', 'where', p.where));
    if (p.why) add(a, el('p', 'why', p.why));
    var fs = add(el('fieldset', 'options'), el('legend', 'sr', p.title));
    (p.options || []).forEach(function (o) {
      var id = 'p' + p.n + '-opt-' + o.key;
      var r = el('input');
      r.type = 'radio'; r.name = 'p' + p.n; r.id = id; r.value = o.key;
      r.checked = p.recommended === o.key;
      r.addEventListener('change', update);
      var body = el('span', 'option-body');
      add(body, add(el('span'), el('strong', null, o.key + '. '), document.createTextNode(o.text)));
      if (o.cost) add(body, add(el('span', 'cost'), el('span', 'cost-label', (L.cost || 'Cost') + ': '), document.createTextNode(o.cost)));
      if (p.recommended === o.key) {
        add(body, add(el('span', 'rec'), el('span', 'chip accent', L.recommended || 'Recommended'),
          p.because ? document.createTextNode(' ' + p.because) : null));
      }
      var lab = el('label', 'option');
      lab.htmlFor = id;
      add(fs, add(lab, r, body));
    });
    add(a, fs);
    var note = el('input', 'note');
    note.type = 'text'; note.id = 'p' + p.n + '-note';
    note.placeholder = L.note || 'Note';
    note.setAttribute('aria-label', (L.note || 'Note') + ' ' + p.n);
    note.addEventListener('input', update);
    return add(a, note);
  }

  /* ---------- the page ---------- */
  var parts = [];
  function part(node, id, label, n) {
    if (!node) return;
    node.id = id;
    parts.push({ id: id, label: label, n: n });
    add(root, node);
  }
  function stat(n, label, cls, href) {
    var b = add(el(href ? 'a' : 'div', cls || null), el('strong', null, String(n)), el('span', null, label));
    if (href) b.href = href;
    return b;
  }
  var steps = [];
  actors.forEach(function (a) { steps = steps.concat(a.steps || []); });
  var nNew = steps.filter(function (s) { return s.change === 'new'; }).length;
  var nChanged = steps.filter(function (s) { return s.change === 'changed'; }).length;
  var mine = decisions.filter(function (c) { return c.by === 'me'; }).length;

  var cast = el('ul', 'cast');
  actors.forEach(function (a) {
    var b = add(el('button'), av(a), add(el('span'), el('strong', null, a.name), a.who ? el('span', 'who', a.who) : null));
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      var on = root.getAttribute('data-focus') !== a.cls;
      if (on) root.setAttribute('data-focus', a.cls); else root.removeAttribute('data-focus');
      cast.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(on && x === b)); });
    });
    add(cast, add(el('li', a.cls), b));
  });
  add(root, add(el('header', 'top'),
    el('p', 'eyebrow', d.status || ''),
    el('h1', null, d.title || ''),
    el('p', 'value', d.value || ''),
    add(el('div', 'glance'),
      points.length ? stat(points.length, L.points || 'Still open', 'warn', '#open') : null,
      mine ? stat(mine, L.toCheck || 'Choices of mine to check', 'hot', '#choices') : null,
      nNew ? stat(nNew, L.stepsNew || 'New steps', null, '#changes') : null,
      nChanged ? stat(nChanged, L.stepsChanged || 'Changed steps', null, '#changes') : null,
      paths.length ? stat(paths.length, L.moments || 'Moments', null, '#flow-moments') : null),
    actors.length > 1 ? el('p', 'cast-hint', L.focus || 'Pick a person to see only their steps.') : null,
    actors.length ? cast : null));
  toCheck = root.querySelector('.glance .hot strong');

  if (paths.length) part(add(section(L.flow || 'The flow'), journeys()), 'flow-moments', L.flow || 'The flow', paths.length);
  if (d.summary && d.summary.length) {
    var words = el('ul', 'words');
    d.summary.forEach(function (x) {
      var plain = typeof x === 'string';
      add(words, add(el('li'), plain || !x.title ? null : el('h3', null, x.title), el('p', null, plain ? x : x.text)));
    });
    part(add(section(L.summary || 'The flow in words'), words), 'words', L.summary || 'The flow in words');
  }
  var ch = changesSection();
  part(ch, 'changes', L.changes || 'What changes', ch ? ch.querySelectorAll('.change').length : 0);
  // a life that only goes forward one state at a time is already told by the moments
  var st = d.states, order = {};
  ((st && st.nodes) || []).forEach(function (n, i) { order[n.id] = i; });
  var branching = st && (st.nodes || []).length > 2 && (st.edges || []).some(function (e) { return order[e[1]] - order[e[0]] !== 1; });
  if (branching) part(add(section(st.title || ''), lifeFigure(st)), 'life', st.title || '');

  if (points.length) {
    var box = el('div', 'points');
    points.forEach(function (p) { add(box, point(p)); });
    // the answers box goes after the last thing there is to answer: my choices, or else the open points
    part(add(section(L.points || 'Still open'), box, mine ? null : answersBox()), 'open', L.points || 'Still open', points.length);
  }

  if (decisions.length) {
    // the choices the user should check come first and open; the rest is one click away
    var groups = el('div', 'groups'), opened = false;
    ['me', 'you', 'before'].forEach(function (by) {
      var some = decisions.filter(function (c) { return c.by === by; });
      if (!some.length) return;
      var ol = el('ol', 'decisions');
      some.forEach(function (c) {
        var body = add(el('div', 'body'), el('span', 'q', c.q), el('span', 'a', c.a));
        var at = (c.steps || []).map(function (id) { return stepOf[id]; }).filter(Boolean);
        if (at.length) {
          var where = add(el('span', 'in-steps'), el('span', null, L.inSteps || 'In'));
          at.forEach(function (s) { add(where, stepLink(s, 'id', s.id)); });
          add(body, where);
        }
        if (by === 'me') verdict(c).forEach(function (n) { add(body, n); });
        var li = add(el('li'), el('span', 'n', String(c.n)), body);
        li.id = 'c-' + c.n;
        add(ol, li);
      });
      var det = add(el('details', 'panel'), add(el('summary'), document.createTextNode(who[by] || by),
        el('span', 'chip ' + (by === 'me' ? 'accent' : ''), String(some.length))), ol);
      if (!opened) det.open = opened = true;
      add(groups, det);
    });
    part(add(section(L.decisions || 'The choices behind it'), groups, mine ? answersBox() : null), 'choices', L.decisions || 'The choices behind it', decisions.length);
  }
  update();

  // a link to something inside a folded part opens the part first
  function reveal() {
    var id = decodeURIComponent(location.hash.slice(1)), n = id && document.getElementById(id);
    for (var p = n && n.parentNode; p; p = p.parentNode) if (p.tagName === 'DETAILS') p.open = true;
    if (n) n.scrollIntoView();
  }
  window.addEventListener('hashchange', reveal);
  if (location.hash) reveal();

  if (coverage.length) {
    var n = function (status) { return coverage.filter(function (c) { return c.status === status; }).length; };
    var table = el('table');
    add(table, add(el('thead'), add(el('tr'), el('th', null, L['case'] || 'Case'), el('th', null, L.source || 'Source'), el('th', null, L.answer || 'Answer'))));
    var tb = el('tbody');
    coverage.forEach(function (c) {
      var cls = c.status === 'covered' ? 'ok' : c.status === 'open' ? 'gap' : '';
      add(tb, add(el('tr'),
        el('td', null, c['case']),
        el('td', 'src', c.source || ''),
        add(el('td', 'ans'), el('span', 'chip ' + cls, L[c.status] || c.status), el('span', null, c.ref || ''))));
    });
    var sum = add(el('summary'), document.createTextNode(L.coverage || 'Cases covered'),
      count(L.covered || 'Covered', n('covered'), 'ok'),
      count(L.unsupported || 'Not supported', n('unsupported')),
      n('open') ? count(L.open || 'Open', n('open'), 'gap') : null);
    part(add(el('details', 'panel'), sum, L.coverageLead ? el('p', 'lead', L.coverageLead) : null, add(el('div', 'scroll'), add(table, tb))),
      'coverage', L.coverage || 'Cases covered', coverage.length);
  }

  if (d.out && d.out.length) part(add(section(L.out || 'Out of this flow'), list('plain', d.out)), 'out', L.out || 'Out of this flow', d.out.length);

  /* ---------- the rail: where you are on a long page ---------- */
  var rail = document.getElementById('rail'), links = {};
  rail.setAttribute('aria-label', L.contents || 'On this page');
  var ol = el('ol');
  parts.forEach(function (x) {
    var a = add(el('a'), el('span', null, x.label), x.n ? el('span', 'n', String(x.n)) : null);
    a.href = '#' + x.id;
    links[x.id] = a;
    add(ol, add(el('li'), a));
  });
  add(rail, ol);
  if (window.IntersectionObserver) {
    var seen = {};
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { seen[e.target.id] = e.isIntersecting; });
      var first = parts.filter(function (x) { return seen[x.id]; })[0];
      if (!first) return;
      parts.forEach(function (x) { links[x.id].className = x === first ? 'here' : ''; });
    }, { rootMargin: '0px 0px -60% 0px' });
    parts.forEach(function (x) { io.observe(document.getElementById(x.id)); });
  }
})();
</script>
